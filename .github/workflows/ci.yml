name: GTG application checks

on:
  push:
    branches:
      - feat/gtg-second-edition-review-build
  pull_request:
    branches:
      - feat/gtg-second-edition-continuation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Report dependency audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = JSON.parse(require("fs").readFileSync("npm-audit.json", "utf8")); console.log("AUDIT_TOTALS", JSON.stringify(a.metadata && a.metadata.vulnerabilities)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log("AUDIT_PACKAGE", name, item.severity, "fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
