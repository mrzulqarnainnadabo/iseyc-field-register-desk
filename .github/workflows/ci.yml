name: GTG application checks

on:
  push:
    branches:
      - feat/gtg-second-edition-review-build
  pull_request:
    branches:
      - feat/gtg-second-edition-continuation

permissions:
  contents: read

concurrency:
  group: gtg-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Report dependency audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = JSON.parse(require("fs").readFileSync("npm-audit.json", "utf8")); console.log("AUDIT_TOTALS", JSON.stringify(a.metadata && a.metadata.vulnerabilities)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log("AUDIT_PACKAGE", name, item.severity, "fixAvailable=" + JSON.stringify(item.fixAvailable));'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = JSON.parse(require("fs").readFileSync("npm-audit-production.json", "utf8")); console.log("PRODUCTION_AUDIT_TOTALS", JSON.stringify(a.metadata && a.metadata.vulnerabilities)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log("PRODUCTION_AUDIT_PACKAGE", name, item.severity, "fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - name: Enforce dependency security threshold
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Start isolated test server
        run: |
          export NOTION_API_KEY="ci-invalid-notion-token"
          export NOTION_REGISTRATIONS_DB_ID="4245db88ef46817f8638f71e34d26205"
          export NOTION_FEEDBACK_DB_ID="4245db88ef4681cc944af1cccceba720"
          export REGISTER_PASSCODE="ci-test-passcode"
          export SESSION_SECRET="ci-test-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz"
          npm run start -- --hostname 127.0.0.1 > /tmp/gtg-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/gtg-home.html; then break; fi
            sleep 2
          done
          grep -q "From Girlhood" /tmp/gtg-home.html
          curl --fail --silent http://127.0.0.1:3000/staff | grep -q "From Girlhood"
          curl --fail --silent http://127.0.0.1:3000/feedback | grep -q "feedback"
          curl --fail --silent http://127.0.0.1:3000/api/register | grep -q '"configured":true'
          curl --fail --silent http://127.0.0.1:3000/api/staff/login | grep -q '"configured":true'
      - name: Browser QA
        run: npx playwright test
      - name: Commit lockfile update
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): lock patched dependency versions"
            git fetch origin feat/gtg-second-edition-review-build
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/feat/gtg-second-edition-review-build
          fi
